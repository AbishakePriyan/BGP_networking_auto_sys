frr defaults traditional
hostname r2
log stdout informational
service integrated-vtysh-config
!
ip prefix-list BLOCK-R1 seq 9999 permit 192.0.2.255/32
ip prefix-list BLOCK-R3 seq 9999 permit 192.0.2.255/32
!
route-map GUARD-R1 deny 10
 match ip address prefix-list BLOCK-R1
route-map GUARD-R1 permit 100
!
route-map GUARD-R3 deny 10
 match ip address prefix-list BLOCK-R3
route-map GUARD-R3 permit 100
!
route-map ALLOW-ALL permit 10
!
router bgp 65002
 bgp router-id 2.2.2.2
 neighbor 10.199.0.2 remote-as 65001
 neighbor 10.199.0.4 remote-as 65003
 address-family ipv4 unicast
  neighbor 10.199.0.2 soft-reconfiguration inbound
  neighbor 10.199.0.4 soft-reconfiguration inbound
  neighbor 10.199.0.2 route-map GUARD-R1 in
  neighbor 10.199.0.2 route-map ALLOW-ALL out
  neighbor 10.199.0.4 route-map GUARD-R3 in
  neighbor 10.199.0.4 route-map ALLOW-ALL out
 exit-address-family
!
