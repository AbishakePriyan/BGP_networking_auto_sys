frr defaults traditional
hostname r3
log stdout informational
service integrated-vtysh-config
!
ip route 10.199.113.0/25 Null0
!
route-map ALLOW-ALL permit 10
!
router bgp 65003
 bgp router-id 3.3.3.3
 neighbor 10.199.0.3 remote-as 65002
 address-family ipv4 unicast
  neighbor 10.199.0.3 route-map ALLOW-ALL in
  neighbor 10.199.0.3 route-map ALLOW-ALL out
 exit-address-family
!
